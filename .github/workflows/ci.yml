name: G-SIPRO CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://gsipro:ci-only@localhost:5433/gsipro?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:validate
      - run: pnpm check
      - run: pnpm build
        env:
          ENTRA_TENANT_ID: 00000000-0000-4000-8000-000000000000
          ENTRA_CLIENT_ID: 00000000-0000-4000-8000-000000000000
          ENTRA_CLIENT_SECRET: build-only-not-a-client-secret
          AUTH_SECRET: build-only-auth-secret-0000000000000000
          AUTH_URL: http://localhost:3001
