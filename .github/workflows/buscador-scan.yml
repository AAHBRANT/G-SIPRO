name: G-SIPRO Buscador — varredura semanal

on:
  workflow_dispatch:
  schedule:
    # Domingo, 09:00 UTC (06:00 em Brasília): não há publicação de novos editais
    # e o portal está descongestionado.
    - cron: "0 9 * * 0"

concurrency:
  group: gsipro-buscador-scan
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      GSIPRO_URL: https://ca-gsipro-hml-aahbrant.thankfulpond-8424c61a.brazilsouth.azurecontainerapps.io
      SCOUT_DISPATCH_TOKEN: ${{ secrets.SCOUT_DISPATCH_TOKEN }}
    steps:
      # A varredura roda dentro de uma requisição HTTP, e o balanceador encerra
      # conexões longas. Por isso o país é varrido em lotes de unidades
      # federativas: cada chamada fica curta, e um lote que falhe não
      # compromete os demais. Quem tiver estados configurados nos filtros
      # continua sendo atendido — o recorte só se aplica a quem varre o Brasil
      # inteiro, e o próprio serviço descarta o que estiver fora do perfil.
      - name: Executar a varredura do Buscador
        run: |
          set -uo pipefail
          test -n "$SCOUT_DISPATCH_TOKEN"
          echo "::add-mask::$SCOUT_DISPATCH_TOKEN"
          falhas=0
          for lote in \
            '["AC","AL","AM","AP","BA"]' \
            '["CE","DF","ES","GO","MA"]' \
            '["MG","MS","MT","PA","PB"]' \
            '["PE","PI","PR","RJ","RN"]' \
            '["RO","RR","RS","SC","SE"]' \
            '["SP","TO"]' ; do
            echo "lote: ${lote}"
            if ! curl --fail --silent --show-error \
              --max-time 600 \
              --request POST \
              --header "Authorization: Bearer ${SCOUT_DISPATCH_TOKEN}" \
              --header "Content-Type: application/json" \
              --data "{\"trigger\":\"SCHEDULED\",\"states\":${lote}}" \
              "${GSIPRO_URL}/api/scouting/scan" ; then
              echo "::warning::lote ${lote} não pôde ser varrido"
              falhas=$((falhas + 1))
            fi
          done
          echo "lotes com falha: ${falhas}"
          test "${falhas}" -lt 6

      # Passo à parte, de propósito: resolução de duplicata e leitura de
      # edital já tentaram rodar dentro da varredura acima e o ingress cortou
      # a conexão perto dos 240 s (504 em sequência, 11/09/2026 e 13/09/2026).
      # Rota própria, orçamento próprio (150 s, dentro da rota).
      #
      # ⚠️ Uma chamada só não bastava: a rota lê até 80 por vez, e com a fila
      # represada grande (259 pendentes, 182 com prazo curto, achado em
      # produção 18/09/2026) uma vez por semana não alcançava — a maioria
      # continuava "edital não lido" dias depois do mecanismo já existir, e a
      # exigência técnica ficava presa perto de 100% (o palpite pelo objeto,
      # não a leitura real). Por isso repete a chamada várias vezes na mesma
      # rodada, parando assim que a resposta disser que não sobrou represado —
      # o teto é só contra rodar sem fim se algo estiver errado.
      #
      # ⚠️ 10 chamadas não bastavam: medido em produção (19/09/2026), cada
      # chamada só lê ~10 editais dentro do orçamento de 150 s (rede + PDF por
      # licitação é mais lento que o esperado), e as 10 chamadas originais
      # sempre voltavam com o represado ainda cheio ("total": 80, o teto da
      # consulta, em toda chamada). 30 chamadas cobrem ~300 leituras por
      # rodada — o suficiente para zerar o represado observado numa única
      # execução, ainda dentro de um teto seguro contra loop sem fim.
      #
      # ⚠️ `if: always()`: achado em produção (21/09/2026) — o PNCP tem DUAS
      # APIs independentes (a de busca, que a varredura usa, e a de arquivo,
      # que a leitura usa) e elas caem em momentos DIFERENTES, às vezes uma no
      # ar e a outra não, no mesmo instante. Sem `always()`, a varredura
      # falhando (busca fora do ar) pulava este passo inteiro — mesmo com a
      # API de arquivo respondendo normalmente, o represado nunca era tocado.
      # Os dois passos não dependem um do outro: cada um trabalha com o que já
      # está no banco, então um não tem por que ficar refém do outro.
      - name: Resolver duplicata e ler edital do represado
        if: always()
        run: |
          set -uo pipefail
          teto=30
          for i in $(seq 1 "$teto"); do
            echo "chamada ${i}/${teto}"
            if ! resposta=$(curl --fail --silent --show-error \
              --max-time 200 \
              --request POST \
              --header "Authorization: Bearer ${SCOUT_DISPATCH_TOKEN}" \
              "${GSIPRO_URL}/api/scouting/process-backlog"); then
              echo "::warning::chamada ${i} do represado falhou — a próxima varredura tenta de novo"
              break
            fi
            echo "${resposta}"
            total=$(echo "${resposta}" | jq -r '.data.editais.total // 0')
            if [ "${total}" -eq 0 ]; then
              echo "represado de leitura zerado"
              break
            fi
          done
